<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BC Hatchery</title>
    {% load static %}
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            color: #333;
            background: #fff;
            line-height: 1.6;
            font-weight: bold;
        }
        
        /* TOP NAV BAR (Medium Size + Sticky) */
        .top-bar {
            background: white;
            color: #333;
            padding: 15px 0; /* Increased padding */
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e0e0e0;
            min-height: 100px; /* Medium Height */
            position: sticky;
            top: 0;
            z-index: 999;
        }
        
        .logo-section {
            display: flex;
            align-items: center;
            padding-left: 25px;
            gap: 25px;
        }
        
        .logo-section img {
            height: 80px; /* Medium logo size */
            width: auto;
        }
        
        .logo-section a {
            font-size: 22px; /* Bigger Home text */
            color: #333;
            text-decoration: none;
            font-weight: 700;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 28px;
            padding-right: 25px;
        }
        
        .nav-right a {
            color: #333;
            text-decoration: none;
            font-size: 22px; /* Bigger Log in text */
            font-weight: 700;
        }
        
        .search-bar {
            background: #f5f5f5;
            border: 1px solid #d0d0d0;
            padding: 10px 16px; /* Bigger search box */
            border-radius: 4px;
            width: 230px; /* Wider search */
        }
        
        .search-bar input {
            border: none;
            outline: none;
            width: 100%;
            font-size: 18px;
            background: transparent;
        }
        
        /* MAIN CONTENT BELOW NAV */
        .main-content {
            padding: 60px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px;
        }
        
        .main-content img {
            max-width: 100%;
            height: auto;
        }
        
        .button-container {
            display: flex;
            gap: 20px;
            justify-content: center;
        }
        
        .button-container img {
            height: 60px;
        }
    </style>
</head>

<body>

    <!-- NAV BAR -->
    <div class="top-bar">
        <div class="logo-section">
            <img src="{% static 'JUSWZ_login_img/BCLOGO.png' %}" alt="BC Logo">
            <a href="{% url 'home' %}">Home</a>
        </div>

        <div class="nav-right">
            <a href="{% url 'login' %}">Log in</a>
            <div class="search-bar">
                <input type="text" placeholder="Search">
            </div>
        </div>
    </div>

    <!-- MAIN CONTENT -->
    <div class="main-content">
        <img src="{% static 'JUSWZ_login_img/hatcheryhome1.png' %}" alt="Hatchery Home 1">
        <img src="{% static 'JUSWZ_login_img/hometext.png' %}" alt="Home Text">
        
        <div class="button-container">
            <a href="{% url 'login' %}">
                <img src="{% static 'JUSWZ_login_img/loginstartbutton.png' %}" alt="Login & Get Started">
            </a>
            <a href="{% url 'learn_more' %}">
                <img src="{% static 'JUSWZ_login_img/learnmorebutton.png' %}" alt="Learn More">
            </a>
        </div>
        
        <img src="{% static 'JUSWZ_login_img/hatcheryhome2.png' %}" alt="Hatchery Home 2">
    </div>

</body>
</html>
